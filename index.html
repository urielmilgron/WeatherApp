<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="weather-app">
        <section class="weather-card">
            <header class="weather-header">
                <div>
                    <p class="eyebrow">Pronóstico</p>
                    <h1>WeatherApp</h1>
                </div>
                <button id="reloadBtn" type="button" class="reload-button">Actualizar</button>
            </header>

            <div id="status" class="status">Error: falta la API key</div>
            <div id="weather" class="weather hidden" aria-live="polite"></div>
        </section>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
