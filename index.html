<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="weather-app">
        <section class="weather-card">
            <header class="weather-header">
                <div>
                    <p class="eyebrow">Pronóstico</p>
                    <h1>WeatherApp</h1>
                </div>

                <div class="header-actions">
                    <label class="city-control country-control" for="countrySelect">
                        <span>País</span>
                        <select id="countrySelect" aria-label="Seleccionar país">
                            <option value="Argentina" selected>Argentina</option>
                            <option value="España">España</option>
                            <option value="Brasil">Brasil</option>
                        </select>
                    </label>
                    <label class="city-control city-control-main" for="citySelect">
                        <span>Ciudad</span>
                        <select id="citySelect" aria-label="Seleccionar ciudad"></select>
                    </label>
                    <button id="reloadBtn" type="button" class="reload-button">Actualizar</button>
                </div>
            </header>

            <div class="content-shell">
                <div class="info-panel">
                    <div id="status" class="status">La app necesita tu clave de acceso</div>
                    <div id="weather" class="weather hidden" aria-live="polite"></div>
                </div>

                <div class="map-row">
                    <div class="map-panel" aria-label="Mapa del país seleccionado">
                        <div id="mapSurface" class="map-surface"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
